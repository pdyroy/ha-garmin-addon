[project]
name = "pacer"
version = "1.0.0"
description = "Home Assistant add-on for AI-powered Garmin fitness coaching"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501"]
